name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      previous_sha: ${{ steps.gather-info.outputs.previous_sha }}
      current_sha: ${{ steps.gather-info.outputs.current_sha }}
      package_version: ${{ steps.gather-info.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        id: lint
        run: |
          echo "Running lint checks..."
          npm run lint
        continue-on-error: true

      - name: Run tests
        id: test
        run: |
          echo "Running tests..."
          npm test
        continue-on-error: true

      - name: Gather deployment information
        id: gather-info
        run: |
          set -euo pipefail
          CURRENT_SHA="${GITHUB_SHA}"
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREVIOUS_SHA="$(git rev-parse HEAD~1)"
          else
            PREVIOUS_SHA="${{ github.event.before }}"
            if [ -z "${PREVIOUS_SHA}" ] || [ "${PREVIOUS_SHA}" = "0000000000000000000000000000000000000000" ]; then
              PREVIOUS_SHA="${CURRENT_SHA}"
            fi
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Previous SHA: ${PREVIOUS_SHA}"
          echo "Current SHA: ${CURRENT_SHA}"
          echo "Package Version: ${PACKAGE_VERSION}"

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const previousSha = '${{ steps.gather-info.outputs.previous_sha }}';
            const currentSha = '${{ steps.gather-info.outputs.current_sha }}';
            const packageVersion = '${{ steps.gather-info.outputs.package_version }}';
            const lintOutcome = '${{ steps.lint.outcome }}';
            const testOutcome = '${{ steps.test.outcome }}';

            const body = [
              '## Deployment Tracking',
              '',
              'Automated deployment workflow tracking issue.',
              '',
              '### Deployment Information',
              '',
              `- **Previous Commit:** ${previousSha}`,
              `- **Current Commit:** ${currentSha}`,
              `- **Package Version:** ${packageVersion}`,
              `- **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Status Checklist',
              '',
              '- [x] Pre-deployment checks initiated',
              '- [ ] Rollback plan prepared',
              '- [ ] Deployment completed',
              '',
              '### Quality Checks',
              '',
              `- Lint: ${lintOutcome}`,
              `- Tests: ${testOutcome}`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${currentSha}`,
              body,
              labels: ['deployment', 'in-progress'],
            });

            core.setOutput('issue_number', issue.number);
            core.info(`Created tracking issue #${issue.number}`);
            return issue.number;

      - name: Comment pre-deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.create-issue.outputs.issue_number }}');
            const previousSha = '${{ steps.gather-info.outputs.previous_sha }}';
            const currentSha = '${{ steps.gather-info.outputs.current_sha }}';
            const packageVersion = '${{ steps.gather-info.outputs.package_version }}';
            const lintOutcome = '${{ steps.lint.outcome }}';
            const testOutcome = '${{ steps.test.outcome }}';

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All preliminary deployment checks have finished.',
              '',
              '### Quality Check Results',
              '',
              `- Lint: ${lintOutcome}`,
              `- Tests: ${testOutcome}`,
              '',
              '### Deployment Context',
              '',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              'Proceeding to rollback preparation...',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  rollback-preparation:
    name: rollback-preparation
    needs: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
      script_created: ${{ steps.package.outputs.script_created }}
      backup_created: ${{ steps.package.outputs.backup_created }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Prepare rollback workspace
        run: |
          set -euo pipefail
          mkdir -p rollback-artifacts/scripts
          mkdir -p rollback-artifacts/backups
          mkdir -p rollback-artifacts/docs

      - name: Create rollback script
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail
          cat > rollback-artifacts/scripts/rollback.sh <<SCRIPT_EOF
          #!/usr/bin/env bash
          # Rollback Script
          # Generated by Deployment Status workflow
          set -euo pipefail

          PREVIOUS_SHA="${PREVIOUS_SHA}"
          CURRENT_SHA="${CURRENT_SHA}"
          PACKAGE_VERSION="${PACKAGE_VERSION}"

          log() {
            echo "[\$(date -u +%Y-%m-%dT%H:%M:%SZ)] \$*"
          }

          fail() {
            log "ERROR: \$*"
            exit 1
          }

          trap 'fail "Rollback failed at line \$LINENO"' ERR

          log "🔄 Initiating rollback for commit \${CURRENT_SHA}"
          log "Previous Commit: \${PREVIOUS_SHA}"
          log "Current Commit: \${CURRENT_SHA}"
          log "Package Version: \${PACKAGE_VERSION}"

          if [ -z "\${PREVIOUS_SHA}" ]; then
            fail "Previous commit SHA is missing"
          fi

          REPO_ROOT="\$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          cd "\${REPO_ROOT}"

          if git rev-parse "\${PREVIOUS_SHA}" >/dev/null 2>&1; then
            log "✅ Previous commit located in repository history"
            log "Resetting working tree to previous commit"
            git reset --hard "\${PREVIOUS_SHA}"
          else
            log "⚠️  Previous commit not found locally, attempting fetch"
            git fetch --all --tags || true
            if git rev-parse "\${PREVIOUS_SHA}" >/dev/null 2>&1; then
              git reset --hard "\${PREVIOUS_SHA}"
            else
              fail "Unable to locate previous commit \${PREVIOUS_SHA}"
            fi
          fi

          BACKUP_DIR="\$(dirname "\$0")/../backups"
          if [ -d "\${BACKUP_DIR}" ]; then
            log "✅ Restoring configuration files from backup"
            [ -f "\${BACKUP_DIR}/package.json" ] && cp "\${BACKUP_DIR}/package.json" ./package.json
            [ -f "\${BACKUP_DIR}/package-lock.json" ] && cp "\${BACKUP_DIR}/package-lock.json" ./package-lock.json
          else
            log "⚠️  Backup directory not found, skipping configuration restore"
          fi

          if [ -f package-lock.json ]; then
            log "✅ Reinstalling dependencies (npm ci)"
            npm ci
          elif [ -f package.json ]; then
            log "✅ Installing dependencies (npm install)"
            npm install
          fi

          log "🎉 Rollback completed successfully"
          SCRIPT_EOF
          chmod +x rollback-artifacts/scripts/rollback.sh
          bash -n rollback-artifacts/scripts/rollback.sh
          echo "Rollback script created and syntax validated"

      - name: Create dependency verification script
        run: |
          set -euo pipefail
          cat > rollback-artifacts/scripts/verify-dependencies.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Dependency Verification Script
          # Used to verify dependency compatibility before/after rollback
          set -euo pipefail

          log() {
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
          }

          fail() {
            log "ERROR: $*"
            exit 1
          }

          trap 'fail "Verification failed at line $LINENO"' ERR

          log "🔍 Verifying dependency compatibility..."

          if [ ! -f package.json ]; then
            fail "package.json not found in current directory"
          fi

          NODE_VERSION="$(node -v 2>/dev/null || echo 'not-installed')"
          NPM_VERSION="$(npm -v 2>/dev/null || echo 'not-installed')"
          log "Node version: ${NODE_VERSION}"
          log "npm version: ${NPM_VERSION}"

          REQUIRED_NODE="$(node -p "require('./package.json').engines && require('./package.json').engines.node || 'any'" 2>/dev/null || echo 'any')"
          log "Required Node engine: ${REQUIRED_NODE}"

          if [ -f package-lock.json ]; then
            log "Checking lockfile integrity"
            npm ci --dry-run >/dev/null 2>&1 && log "✅ Lockfile compatible" || log "⚠️  Lockfile compatibility check reported issues"
          fi

          log "Running npm audit (production deps only)"
          npm audit --omit=dev || log "⚠️  npm audit reported issues (continuing)"

          log "✅ Dependency verification completed"
          VERIFY_EOF
          chmod +x rollback-artifacts/scripts/verify-dependencies.sh
          bash -n rollback-artifacts/scripts/verify-dependencies.sh

      - name: Backup configuration files
        run: |
          set -euo pipefail
          cp package.json rollback-artifacts/backups/package.json
          cp package-lock.json rollback-artifacts/backups/package-lock.json

          cat > rollback-artifacts/backups/.env.template <<'ENV_EOF'
          # Environment template captured during deployment
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          # Add additional environment variables required by your deployment below
          ENV_EOF

          cat > rollback-artifacts/backups/.env.example <<'ENV_EOF'
          # Example environment variables
          NODE_ENV=development
          PORT=3000
          LOG_LEVEL=debug
          ENV_EOF

      - name: Create rollback documentation
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > rollback-artifacts/docs/ROLLBACK.md <<DOC_EOF
          # Rollback Documentation

          This document explains how to roll back the deployment associated with commit
          \`${CURRENT_SHA}\` (package version \`${PACKAGE_VERSION}\`).

          ## Deployment Information

          - **Previous Commit:** ${PREVIOUS_SHA}
          - **Current Commit:** ${CURRENT_SHA}
          - **Package Version:** ${PACKAGE_VERSION}
          - **Workflow Run:** ${RUN_ID}

          ## Step-by-Step Rollback Instructions

          ### Step 1: Download the rollback artifact

          \`\`\`bash
          gh run download ${RUN_ID} --name rollback-package-${CURRENT_SHA}
          \`\`\`

          ### Step 2: Verify checksum integrity

          \`\`\`bash
          sha256sum -c rollback-package.tar.gz.sha256
          \`\`\`

          ### Step 3: Extract the rollback package

          \`\`\`bash
          tar -xzf rollback-package.tar.gz
          \`\`\`

          ### Step 4: Verify dependencies compatibility

          \`\`\`bash
          ./scripts/verify-dependencies.sh
          \`\`\`

          ### Step 5: Execute the rollback

          \`\`\`bash
          ./scripts/rollback.sh
          \`\`\`

          ### Step 6: Run smoke tests and monitor

          - Confirm application boots cleanly with the previous commit.
          - Watch logs for the first 10 minutes after rollback.
          - Verify external dependencies are healthy.

          ## Verification Checklist

          - [ ] Verified previous commit hash matches \`${PREVIOUS_SHA}\`
          - [ ] Restored \`package.json\` and \`package-lock.json\` from backup
          - [ ] Reinstalled dependencies with \`npm ci\`
          - [ ] Smoke tests passed
          - [ ] Monitoring confirmed deployment health

          ## Emergency Contacts

          For urgent issues, contact the on-call engineer through the operations runbook.
          DOC_EOF

      - name: Compress rollback package and generate checksum
        id: package
        env:
          COMMIT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="rollback-package-${COMMIT_SHA}"

          if [ -x rollback-artifacts/scripts/rollback.sh ]; then
            SCRIPT_CREATED="true"
          else
            SCRIPT_CREATED="false"
          fi

          if [ -f rollback-artifacts/backups/package.json ] && [ -f rollback-artifacts/backups/package-lock.json ]; then
            BACKUP_CREATED="true"
          else
            BACKUP_CREATED="false"
          fi

          tar -czf rollback-artifacts/rollback-package.tar.gz \
            -C rollback-artifacts \
            scripts backups docs

          CHECKSUM="$(sha256sum rollback-artifacts/rollback-package.tar.gz | awk '{print $1}')"
          echo "${CHECKSUM}  rollback-package.tar.gz" > rollback-artifacts/rollback-package.tar.gz.sha256

          echo "Rollback script created: ${SCRIPT_CREATED}"
          echo "Configuration backup: ${BACKUP_CREATED}"
          echo "Artifact: ${ARTIFACT_NAME}"
          echo "SHA256: ${CHECKSUM}"

          {
            echo "checksum=${CHECKSUM}"
            echo "script_created=${SCRIPT_CREATED}"
            echo "backup_created=${BACKUP_CREATED}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          path: rollback-artifacts/
          retention-days: 30

      - name: Comment rollback plan on tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ needs.pre-deployment.outputs.issue_number }}');
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const checksum = '${{ steps.package.outputs.checksum }}';
            const scriptCreated = '${{ steps.package.outputs.script_created }}';
            const backupCreated = '${{ steps.package.outputs.backup_created }}';
            const artifactName = '${{ steps.package.outputs.artifact_name }}';

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'A comprehensive rollback package has been generated and uploaded as a workflow artifact.',
              '',
              '### Deployment Information',
              '',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '',
              '### Rollback Components',
              '',
              `- ✅ Executable rollback script generated (Rollback script created: ${scriptCreated})`,
              `- ✅ Configuration backups stored (Configuration backup: ${backupCreated})`,
              '- ✅ Dependency verification script created',
              '- ✅ Detailed rollback documentation written',
              '- ✅ Compressed rollback package archived with SHA256 checksum',
              '- ✅ Artifact uploaded with 30-day retention',
              '',
              '### Quick Rollback Command',
              '',
              '```bash',
              `gh run download ${context.runId} --name ${artifactName}`,
              'tar -xzf rollback-package.tar.gz',
              './scripts/verify-dependencies.sh',
              './scripts/rollback.sh',
              '```',
              '',
              '### Verification Status',
              '',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '',
              '_Proceeding to post-deployment finalization..._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  post-deployment:
    name: post-deployment
    needs: [pre-deployment, rollback-preparation]
    runs-on: ubuntu-latest
    steps:
      - name: Finalize deployment tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ needs.pre-deployment.outputs.issue_number }}');
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const checksum = '${{ needs.rollback-preparation.outputs.checksum }}';
            const artifactName = '${{ needs.rollback-preparation.outputs.artifact_name }}';

            // Remove the in-progress label (ignore if missing)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress',
              });
              core.info('Removed in-progress label');
            } catch (err) {
              core.warning(`Could not remove in-progress label: ${err.message}`);
            }

            // Add the completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed'],
            });
            core.info('Added completed label');

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              'The deployment workflow has finished all stages successfully.',
              '',
              '### Summary',
              '',
              `- **Previous Commit:** ${previousSha}`,
              `- **Current Commit:** ${currentSha}`,
              `- **Package Version:** ${packageVersion}`,
              '',
              '### Rollback Artifact Details',
              '',
              `- **Artifact Name:** ${artifactName}`,
              `- **SHA256 Checksum:** ${checksum}`,
              '- **Retention:** 30 days',
              `- **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Rollback artifacts are stored on this workflow run and remain available for emergency rollback.',
              '',
              'Closing this deployment tracking issue.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed tracking issue #${issueNumber}`);
