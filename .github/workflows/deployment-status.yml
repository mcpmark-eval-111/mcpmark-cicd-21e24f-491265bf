name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture_info.outputs.previous_sha }}
      current_sha: ${{ steps.capture_info.outputs.current_sha }}
      short_sha: ${{ steps.capture_info.outputs.short_sha }}
      package_version: ${{ steps.capture_info.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Capture deployment information
        id: capture_info
        run: |
          set -euo pipefail
          CURRENT_SHA="${{ github.sha }}"
          SHORT_SHA="${CURRENT_SHA:0:7}"
          PREVIOUS_SHA="$(git rev-parse "${CURRENT_SHA}^" 2>/dev/null || echo "${CURRENT_SHA}")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          {
            echo "current_sha=${CURRENT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "previous_sha=${PREVIOUS_SHA}"
            echo "package_version=${PACKAGE_VERSION}"
          } >> "${GITHUB_OUTPUT}"

          echo "Current commit: ${CURRENT_SHA}"
          echo "Previous commit: ${PREVIOUS_SHA}"
          echo "Package version: ${PACKAGE_VERSION}"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        env:
          SHORT_SHA: ${{ steps.capture_info.outputs.short_sha }}
          CURRENT_SHA: ${{ steps.capture_info.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.capture_info.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.capture_info.outputs.package_version }}
        with:
          script: |
            const shortSha = process.env.SHORT_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Deployment Tracking',
              '',
              `- **Current Commit**: ${currentSha}`,
              `- **Previous Commit**: ${previousSha}`,
              `- **Package Version**: ${packageVersion}`,
              `- **Branch**: main`,
              `- **Workflow Run**: [#${context.runId}](${runUrl})`,
              '',
              'This issue tracks the progress of the deployment.',
              '',
              '### Pipeline Stages',
              '- [x] Pre-deployment checks initiated',
              '- [ ] Rollback preparation',
              '- [ ] Post-deployment finalization'
            ].join('
');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${shortSha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', issue.data.number);
            core.info(`Created tracking issue #${issue.data.number}`);

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number }}
          CURRENT_SHA: ${{ steps.capture_info.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.capture_info.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.capture_info.outputs.package_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const currentSha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All pre-deployment quality gates have passed successfully.',
              '',
              '### Results',
              '- ✅ Lint: passed (`npm run lint`)',
              '- ✅ Tests: passed (`npm test`)',
              '- ✅ Dependencies installed (`npm ci`)',
              '',
              '### Captured Information',
              `- **Previous Commit**: ${previousSha}`,
              `- **Current Commit**: ${currentSha}`,
              `- **Package Version**: ${packageVersion}`,
              '',
              'Proceeding to rollback preparation stage...'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  rollback-preparation:
    name: rollback-preparation
    needs: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.prepare_rollback.outputs.artifact_name }}
      checksum: ${{ steps.prepare_rollback.outputs.checksum }}
      script_created: ${{ steps.prepare_rollback.outputs.script_created }}
      backup_created: ${{ steps.prepare_rollback.outputs.backup_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build rollback artifacts
        id: prepare_rollback
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="rollback-package-${SHORT_SHA}"
          ROLLBACK_ROOT="rollback"
          mkdir -p "${ROLLBACK_ROOT}/scripts" "${ROLLBACK_ROOT}/backup" "${ROLLBACK_ROOT}/docs"

          # ----- Rollback script with proper error handling -----
          cat > "${ROLLBACK_ROOT}/scripts/rollback.sh" <<'ROLLBACK_SCRIPT'
          #!/usr/bin/env bash
          # Rollback script for the deployment.
          # Usage: ./rollback.sh [target_sha]
          set -euo pipefail
          IFS=$'
	'

          log() {
            local level="$1"
            shift
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')][${level}] $*"
          }

          on_error() {
            log "ERROR" "Rollback failed at line ${BASH_LINENO[0]} (exit code $?)"
            log "ERROR" "Investigate the failure and rerun manually if necessary."
            exit 1
          }
          trap on_error ERR

          ROLLBACK_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          TARGET_SHA="${1:-__PREVIOUS_SHA__}"

          log "INFO" "Starting rollback to ${TARGET_SHA}"
          log "INFO" "Rollback workspace: ${ROLLBACK_DIR}"

          if ! command -v git >/dev/null 2>&1; then
            log "ERROR" "git is required to perform rollback"
            exit 1
          fi

          if ! command -v node >/dev/null 2>&1; then
            log "WARN" "node not found; dependency verification will be skipped"
          fi

          if [ -d .git ]; then
            log "INFO" "Resetting working tree to ${TARGET_SHA}"
            git fetch --all --tags
            git checkout "${TARGET_SHA}"
          else
            log "WARN" "Not inside a git repository; skipping git checkout step"
          fi

          if [ -f "${ROLLBACK_DIR}/backup/package.json.backup" ]; then
            log "INFO" "Restoring package.json from backup"
            cp "${ROLLBACK_DIR}/backup/package.json.backup" package.json
          fi

          if [ -f "${ROLLBACK_DIR}/backup/package-lock.json.backup" ]; then
            log "INFO" "Restoring package-lock.json from backup"
            cp "${ROLLBACK_DIR}/backup/package-lock.json.backup" package-lock.json
          fi

          if [ -x "${ROLLBACK_DIR}/scripts/verify-dependencies.sh" ]; then
            log "INFO" "Running dependency verification"
            "${ROLLBACK_DIR}/scripts/verify-dependencies.sh" || log "WARN" "Dependency verification reported issues"
          fi

          if command -v npm >/dev/null 2>&1; then
            log "INFO" "Reinstalling dependencies via npm ci"
            npm ci
          else
            log "WARN" "npm not available; skipping dependency installation"
          fi

          log "INFO" "Rollback to ${TARGET_SHA} completed successfully"
          ROLLBACK_SCRIPT

          # Substitute the previous SHA placeholder
          sed -i "s|__PREVIOUS_SHA__|${PREVIOUS_SHA}|g" "${ROLLBACK_ROOT}/scripts/rollback.sh"
          chmod +x "${ROLLBACK_ROOT}/scripts/rollback.sh"

          # ----- Configuration backups -----
          cp package.json "${ROLLBACK_ROOT}/backup/package.json.backup"
          if [ -f package-lock.json ]; then
            cp package-lock.json "${ROLLBACK_ROOT}/backup/package-lock.json.backup"
          fi

          cat > "${ROLLBACK_ROOT}/backup/.env.template" <<'ENV_TEMPLATE'
          # Environment template captured for rollback
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          # Add additional environment variables your service requires below.
          ENV_TEMPLATE

          cat > "${ROLLBACK_ROOT}/backup/deployment-metadata.json" <<METADATA
          {
            "previous_commit": "${PREVIOUS_SHA}",
            "current_commit": "${CURRENT_SHA}",
            "short_sha": "${SHORT_SHA}",
            "package_version": "${PACKAGE_VERSION}",
            "artifact_name": "${ARTIFACT_NAME}",
            "captured_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          METADATA

          # ----- Dependency verification script -----
          cat > "${ROLLBACK_ROOT}/scripts/verify-dependencies.sh" <<'VERIFY_SCRIPT'
          #!/usr/bin/env bash
          # Verify dependency compatibility before completing a rollback.
          set -euo pipefail

          log() {
            echo "[verify-dependencies] $*"
          }

          ROLLBACK_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
          BACKUP_PACKAGE="${ROLLBACK_DIR}/backup/package.json.backup"

          if [ ! -f "${BACKUP_PACKAGE}" ]; then
            log "Backup package.json not found at ${BACKUP_PACKAGE}"
            exit 1
          fi

          if ! command -v node >/dev/null 2>&1; then
            log "node executable is required"
            exit 1
          fi

          NODE_VERSION="$(node -v)"
          log "Detected Node.js ${NODE_VERSION}"

          REQUIRED_NODE="$(node -p "require('${BACKUP_PACKAGE}').engines && require('${BACKUP_PACKAGE}').engines.node || ''")"
          if [ -n "${REQUIRED_NODE}" ]; then
            log "Required Node.js engine range: ${REQUIRED_NODE}"
          fi

          DEP_COUNT="$(node -p "Object.keys(require('${BACKUP_PACKAGE}').dependencies || {}).length")"
          DEV_DEP_COUNT="$(node -p "Object.keys(require('${BACKUP_PACKAGE}').devDependencies || {}).length")"
          log "Dependencies in backup: ${DEP_COUNT}"
          log "Dev dependencies in backup: ${DEV_DEP_COUNT}"

          if [ -f package.json ]; then
            CURRENT_DEPS="$(node -p "Object.keys(require('./package.json').dependencies || {}).length")"
            log "Dependencies in current package.json: ${CURRENT_DEPS}"
          fi

          log "Dependency verification finished"
          VERIFY_SCRIPT
          chmod +x "${ROLLBACK_ROOT}/scripts/verify-dependencies.sh"

          # ----- Detailed rollback documentation -----
          cat > "${ROLLBACK_ROOT}/docs/ROLLBACK.md" <<DOCS
          # Rollback Procedure

          This package contains everything required to roll the deployment back from
          \`${CURRENT_SHA}\` to \`${PREVIOUS_SHA}\`.

          ## Package Contents

          | Path | Purpose |
          |------|---------|
          | \`scripts/rollback.sh\` | Executable rollback script with error handling |
          | \`scripts/verify-dependencies.sh\` | Dependency compatibility checker |
          | \`backup/package.json.backup\` | Snapshot of package.json |
          | \`backup/package-lock.json.backup\` | Snapshot of package-lock.json (if present) |
          | \`backup/.env.template\` | Environment variable template |
          | \`backup/deployment-metadata.json\` | Captured deployment metadata |
          | \`docs/ROLLBACK.md\` | This document |

          ## Step-by-Step Instructions

          1. **Download the artifact**

             Download the workflow artifact named \`${ARTIFACT_NAME}\` from the GitHub
             Actions run that produced this rollback package.

          2. **Verify checksum**

             \`\`\`bash
             sha256sum -c rollback-package.tar.gz.sha256
             \`\`\`

          3. **Extract the package**

             \`\`\`bash
             tar -xzf rollback-package.tar.gz
             cd rollback
             \`\`\`

          4. **Run dependency verification**

             \`\`\`bash
             ./scripts/verify-dependencies.sh
             \`\`\`

          5. **Execute rollback**

             \`\`\`bash
             ./scripts/rollback.sh ${PREVIOUS_SHA}
             \`\`\`

          6. **Validate the application**

             - Run \`npm test\` and \`npm run lint\` to ensure the previous commit is healthy.
             - Hit the \`/health\` endpoint to confirm the service responds.

          ## Metadata

          - **Previous Commit**: ${PREVIOUS_SHA}
          - **Current Commit**: ${CURRENT_SHA}
          - **Package Version**: ${PACKAGE_VERSION}
          - **Artifact Name**: ${ARTIFACT_NAME}

          ## Troubleshooting

          - If \`git checkout\` fails because the working tree is dirty, stash or discard
            local changes before retrying.
          - If \`npm ci\` fails, ensure the backed up \`package-lock.json\` matches your
            local \`package.json\`. Falling back to \`npm install\` is acceptable when
            the lockfile is missing.
          - For repeated failures, escalate to the on-call engineer and reference the
            workflow run that produced this artifact.
          DOCS

          # ----- Verification flags -----
          if [ -x "${ROLLBACK_ROOT}/scripts/rollback.sh" ] && [ -s "${ROLLBACK_ROOT}/scripts/rollback.sh" ]; then
            SCRIPT_CREATED=true
          else
            SCRIPT_CREATED=false
          fi

          if [ -f "${ROLLBACK_ROOT}/backup/package.json.backup" ]; then
            BACKUP_CREATED=true
          else
            BACKUP_CREATED=false
          fi

          # Validate that the rollback script has valid bash syntax.
          bash -n "${ROLLBACK_ROOT}/scripts/rollback.sh"
          bash -n "${ROLLBACK_ROOT}/scripts/verify-dependencies.sh"

          # ----- Compress and checksum -----
          tar -czf rollback-package.tar.gz "${ROLLBACK_ROOT}"
          CHECKSUM="$(sha256sum rollback-package.tar.gz | awk '{print $1}')"
          echo "${CHECKSUM}  rollback-package.tar.gz" > rollback-package.tar.gz.sha256

          # Also place a checksum file inside the rollback directory for completeness.
          cp rollback-package.tar.gz.sha256 "${ROLLBACK_ROOT}/rollback-package.tar.gz.sha256"

          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "checksum=${CHECKSUM}"
            echo "script_created=${SCRIPT_CREATED}"
            echo "backup_created=${BACKUP_CREATED}"
          } >> "${GITHUB_OUTPUT}"

          echo "Artifact: ${ARTIFACT_NAME}"
          echo "SHA256: ${CHECKSUM}"
          echo "Rollback script created: ${SCRIPT_CREATED}"
          echo "Configuration backup: ${BACKUP_CREATED}"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_rollback.outputs.artifact_name }}
          path: |
            rollback-package.tar.gz
            rollback-package.tar.gz.sha256
            rollback/
          retention-days: 30
          if-no-files-found: error

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ steps.prepare_rollback.outputs.artifact_name }}
          CHECKSUM: ${{ steps.prepare_rollback.outputs.checksum }}
          SCRIPT_CREATED: ${{ steps.prepare_rollback.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.prepare_rollback.outputs.backup_created }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const checksum = process.env.CHECKSUM;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '# 🔄 Rollback Plan Ready',
              '',
              'A complete rollback package has been generated and uploaded as a workflow artifact.',
              '',
              '## Deployment Information',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '## Rollback Components',
              '- ✅ Executable rollback script with proper error handling',
              '- ✅ Configuration backups (package.json, package-lock.json, env templates)',
              '- ✅ Dependency verification script for compatibility checking',
              '- ✅ Detailed rollback documentation with step-by-step instructions',
              '- ✅ Compressed rollback package (tar.gz)',
              '- ✅ SHA256 checksum file for integrity verification',
              '',
              '## Verification Status',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- SHA256: ${checksum}`,
              '',
              '## Quick Rollback Command',
              '',
              'Use the following commands to perform a quick rollback once the artifact has been downloaded:',
              '',
              '```bash',
              `# 1. Verify the downloaded artifact matches the published checksum`,
              `sha256sum -c rollback-package.tar.gz.sha256`,
              '',
              `# 2. Extract the rollback package`,
              `tar -xzf rollback-package.tar.gz`,
              '',
              `# 3. Run the rollback script targeting the previous commit`,
              `cd rollback && ./scripts/rollback.sh ${previousSha}`,
              '```',
              '',
              `Artifact retention: 30 days. Workflow run: [#${context.runId}](${runUrl}).`
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  post-deployment:
    name: post-deployment
    needs: [pre-deployment, rollback-preparation]
    runs-on: ubuntu-latest
    steps:
      - name: Swap labels and finalize deployment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ needs.rollback-preparation.outputs.artifact_name }}
          CHECKSUM: ${{ needs.rollback-preparation.outputs.checksum }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const currentSha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const checksum = process.env.CHECKSUM;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Remove the in-progress label (ignore if it does not exist).
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
            } catch (error) {
              core.warning(`Could not remove in-progress label: ${error.message}`);
            }

            // Add the completed label.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });

            const body = [
              '# ✅ Deployment Completed Successfully',
              '',
              'All deployment stages have finished without errors.',
              '',
              '## Deployment Summary',
              `- Current Commit: ${currentSha}`,
              `- Previous Commit: ${previousSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              '## Rollback Artifact Details',
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '- Retention: 30 days',
              '',
              `Workflow run: [#${context.runId}](${runUrl}).`,
              '',
              'The deployment tracking issue is now being closed.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

            core.info(`Closed deployment tracking issue #${issueNumber}`);
